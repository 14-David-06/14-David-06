name: Generate snake animation

on:
  # se regenera cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  # permite ejecutarlo manualmente desde la pestaña Actions
  workflow_dispatch:
  # y en cada push a main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#00a86b&color_dots=#ebedf0,#b3ecff,#4dd2ff,#00a3cc,#006680
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00ff9c&color_dots=#161b22,#033a4d,#05668d,#00a8cc,#00d4ff

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
